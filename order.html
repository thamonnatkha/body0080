<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>สั่งซื้อสินค้า — Body Scent</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .page-title {
      font-size: var(--text-3xl);
    }

    .section--page {
      padding-top: clamp(3.5rem, 7vw, 6rem);
    }

    #items {
      min-height: 5rem;
    }

    .field .hint {
      margin: 0;
      font-size: var(--text-sm);
      color: var(--ink-soft);
    }

    .form-actions {
      margin-top: var(--space-2);
    }

    .back-link {
      margin-top: var(--space-4);
      font-size: var(--text-sm);
    }
  </style>
</head>
<body>

  <header class="site-header">
    <div class="container">
      <a class="brand" href="index.html">Body Scent</a>
      <nav aria-label="เมนูหลัก">
        <ul class="nav">
          <li><a href="index.html">หน้าแรก</a></li>
          <li><a href="product.html">สินค้า</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main>
    <section class="section section--page">
      <div class="container">
        <div class="section-head">
          <h1 class="page-title">สั่งซื้อสินค้า</h1>
          <p>กรอกข้อมูลของคุณเพื่อยืนยันคำสั่งซื้อ</p>
        </div>

        <form id="orderForm" class="form">
          <div class="field">
            <label for="customerName">ชื่อลูกค้า</label>
            <input class="input" type="text" id="customerName" name="customerName" autocomplete="name" required>
          </div>

          <div class="field">
            <label for="contact">เบอร์โทร / Line</label>
            <input class="input" type="text" id="contact" name="contact" placeholder="เบอร์โทรศัพท์ หรือ Line ID" required>
          </div>

          <div class="field">
            <label for="items">รายการสินค้า</label>
            <textarea class="textarea" id="items" name="items" required></textarea>
            <p class="hint">ถ้าต้องการสั่งหลายรายการ สามารถแก้ไขรายการและจำนวนเงินรวมได้</p>
          </div>

          <div class="field">
            <label for="total">จำนวนเงินรวม (บาท)</label>
            <input class="input" type="text" id="total" name="total" inputmode="decimal" pattern="[0-9]+(\.[0-9]+)?" title="กรอกเป็นตัวเลขเท่านั้น" required>
          </div>

          <div class="field">
            <label for="note">หมายเหตุ (ไม่บังคับ)</label>
            <textarea class="textarea" id="note" name="note"></textarea>
          </div>

          <div class="form-actions">
            <button type="submit" class="btn btn--gold btn--block">ยืนยันสั่งซื้อ</button>
          </div>
        </form>

        <p class="back-link"><a href="product.html">กลับไปเลือกสินค้า</a></p>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>Body Scent</p>
      <p>&copy; 2026 Body Scent สงวนลิขสิทธิ์</p>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
