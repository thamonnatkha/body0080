<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>คำสั่งซื้อ — Body Scent</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .page-title {
      font-size: var(--text-3xl);
    }

    .section--page {
      padding-top: clamp(3.5rem, 7vw, 6rem);
    }

    .table-wrap {
      overflow-x: auto;
      border: 1px solid var(--line-soft);
      border-radius: var(--radius);
    }

    #ordersTable {
      width: 100%;
      min-width: 760px;
      border-collapse: collapse;
      font-size: var(--text-sm);
    }

    #ordersTable th,
    #ordersTable td {
      padding: 1rem 1.25rem;
      text-align: left;
      vertical-align: top;
      line-height: 1.7;
      border-bottom: 1px solid var(--line-soft);
    }

    #ordersTable th {
      background: var(--cream);
      color: var(--ink);
      font-weight: 400;
      white-space: nowrap;
    }

    #ordersTable td {
      color: var(--ink-soft);
    }

    #ordersTable td:first-child,
    #ordersTable td:nth-child(5) {
      white-space: nowrap;
    }

    #ordersTable tbody tr:last-child td {
      border-bottom: 0;
    }
  </style>
</head>
<body>

  <header class="site-header">
    <div class="container">
      <a class="brand" href="index.html">Body Scent</a>
    </div>
  </header>

  <main>
    <section class="section section--page">
      <div class="container">
        <div class="section-head">
          <h1 class="page-title">คำสั่งซื้อ</h1>
          <p>เรียงจากรายการล่าสุดก่อน ข้อมูลมาจาก Google Sheet จึงอาจใช้เวลาสักครู่กว่าออเดอร์ใหม่จะแสดง</p>
        </div>

        <div class="table-wrap" role="region" aria-label="ตารางคำสั่งซื้อ" tabindex="0">
          <table id="ordersTable">
            <caption class="visually-hidden">รายการคำสั่งซื้อ</caption>
            <thead>
              <tr>
                <th scope="col">วันเวลา</th>
                <th scope="col">ชื่อลูกค้า</th>
                <th scope="col">เบอร์โทร/Line</th>
                <th scope="col">รายการสินค้า</th>
                <th scope="col">จำนวนเงินรวม</th>
                <th scope="col">หมายเหตุ</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>Body Scent</p>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
